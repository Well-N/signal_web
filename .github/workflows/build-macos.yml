name: Build macOS app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-macos.yml
      - desktop/**
      - pipeline/**
      - web/**

permissions:
  contents: read

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build dependencies
        run: |
          python -m pip install --disable-pip-version-check ./pipeline pyinstaller==6.22.3
          npm ci --prefix web
          npm ci --prefix desktop
      - name: Build macOS package
        env:
          SIGNALWEB_BUILD_PYTHON: python
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:mac --prefix desktop
      - name: Verify package
        run: |
          test -f "desktop/dist/SignalWeb-0.1.3-mac-${{ matrix.arch }}.dmg"
          test -f "desktop/dist/SignalWeb-0.1.3-mac-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: SignalWeb-mac-${{ matrix.arch }}
          path: |
            desktop/dist/SignalWeb-0.1.3-mac-${{ matrix.arch }}.dmg
            desktop/dist/SignalWeb-0.1.3-mac-${{ matrix.arch }}.zip
          if-no-files-found: error
