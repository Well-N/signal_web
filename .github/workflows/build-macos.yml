name: Build macOS app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-macos.yml
      - android/**
      - desktop/**
      - pipeline/**
      - web/**

permissions:
  contents: read

concurrency:
  group: signalweb-macos-build
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install locked validation dependencies
        run: |
          python -m pip install --disable-pip-version-check uv==0.13.6
          cd pipeline
          python -m uv export --frozen --extra dev --no-emit-project --no-header --format requirements-txt --output-file /tmp/requirements-dev.txt
          python -m pip install --disable-pip-version-check --require-hashes --no-deps -r /tmp/requirements-dev.txt
          cd ..
          npm ci --prefix web
      - name: Run backend tests
        working-directory: pipeline
        run: python -m pytest
      - name: Lint web application
        run: npm run lint --prefix web
      - name: Build web application
        run: npm run build --prefix web

  android:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build Android APK
        working-directory: android
        run: bash gradlew lintDebug assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SignalWeb-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  macos:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build dependencies
        run: |
          python -m pip install --disable-pip-version-check uv==0.13.6
          cd pipeline
          python -m uv export --frozen --no-dev --no-emit-project --no-header --format requirements-txt --output-file /tmp/requirements.txt
          python -m pip install --disable-pip-version-check --require-hashes --no-deps -r /tmp/requirements.txt
          python -m pip install --disable-pip-version-check pyinstaller==6.22.3
          cd ..
          npm ci --prefix web
          npm ci --prefix desktop
      - name: Build macOS package
        env:
          SIGNALWEB_BUILD_PYTHON: python
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:mac --prefix desktop
      - name: Verify package
        run: |
          test "$(find desktop/dist -maxdepth 1 -name "SignalWeb-*-mac-${{ matrix.arch }}.dmg" | wc -l | tr -d ' ')" = "1"
          test "$(find desktop/dist -maxdepth 1 -name "SignalWeb-*-mac-${{ matrix.arch }}.zip" | wc -l | tr -d ' ')" = "1"
      - name: Start packaged app, open home page and capture screenshot
        run: node desktop/scripts/smoke-mac.cjs
      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: SignalWeb-mac-${{ matrix.arch }}-home-screenshot
          path: desktop/dist/SignalWeb-mac-${{ matrix.arch }}-home.png
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: SignalWeb-mac-${{ matrix.arch }}
          path: |
            desktop/dist/SignalWeb-*-mac-${{ matrix.arch }}.dmg
            desktop/dist/SignalWeb-*-mac-${{ matrix.arch }}.zip
          if-no-files-found: error
